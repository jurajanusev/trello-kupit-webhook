<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nastavenia Show Checklist</title>
    <link rel="stylesheet" href="./powerup.css">
  </head>
  <body>
    <main id="settings">
      <h1>Show Checklist</h1>
      <p class="intro">Nastavenia platia pre teba na tejto nástenke.</p>

      <section class="section">
        <h2>Obsah odznakov</h2>
        <label class="check"><input id="showCompleteChecklists" type="checkbox"> Zobraziť aj kompletne hotové checklisty</label>
        <label class="check"><input id="showChecklistName" type="checkbox"> Zobraziť názov checklistu</label>
        <label class="check"><input id="showProgress" type="checkbox"> Zobraziť priebeh</label>
        <label class="check"><input id="showCompleteItems" type="checkbox"> Zobraziť aj hotové položky</label>
        <div class="grid">
          <label class="field">Najviac checklistov na karte
            <input id="maxChecklists" type="number" min="1" max="20">
          </label>
          <label class="field">Položky z jedného checklistu
            <input id="itemsPerChecklist" type="number" min="0" max="5">
          </label>
        </div>
      </section>

      <section class="section">
        <h2>Farby</h2>
        <div class="grid">
          <label class="field">Hotový checklist
            <select id="completeColor"></select>
          </label>
          <label class="field">Nehotový checklist
            <select id="incompleteColor"></select>
          </label>
        </div>
      </section>

      <div class="actions">
        <button id="save" type="button">Uložiť nastavenia</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </main>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./core.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
